# ============================================================
#  RAG Agent - Configuration File
#  Edit these values to match your local environment.
#  Do NOT quote the values (no ' or " needed).
# ============================================================

# ── Folder Paths ────────────────────────────────────────────
input.folder  = C:\Users\ADMIN\OneDrive\Desktop\RAG\RAG_Agent\Input
output.folder = C:\Users\ADMIN\OneDrive\Desktop\RAG\RAG_Agent\Output

# ── RAG / Knowledge Base ────────────────────────────────────
rag.errors.file      = errors.txt
rag.chunk.size       = 300
rag.chunk.overlap    = 50
rag.top.k.results    = 2

# ── Embedding Model ─────────────────────────────────────────
embedding.model.name = sentence-transformers/all-MiniLM-L6-v2

# ── BOM File Name Patterns ──────────────────────────────────
# Substrings used to identify PLM vs DMA files by filename
bom.plm.pattern = BOM_REPORT_VPMReference
bom.dma.pattern = BOM_Report

# ── BOM Delimiters ──────────────────────────────────────────
bom.plm.delimiter = ,
bom.dma.delimiter = |

# ── BOM Column Indices (0-based, after stripping quotes) ────
# PLM columns
bom.plm.col.parent.type    = 1
bom.plm.col.parent.part    = 2
bom.plm.col.parent.version = 3
bom.plm.col.has.links      = 7
bom.plm.col.child.part     = 9
bom.plm.skip.link.value    = NO_LINKS

# DMA columns
bom.dma.col.parent.type    = 7
bom.dma.col.parent.part    = 3
bom.dma.col.parent.version = 4
bom.dma.col.has.links      = 8
bom.dma.col.child.part     = 12
bom.dma.skip.link.value    = NO LINKS

# ── Report ──────────────────────────────────────────────────
report.prefix   = MissingReport_
report.header   = Parent Type,Parent Name,Parent Version,Child Name,Qty in DMA,Qty in PLM,Diff
